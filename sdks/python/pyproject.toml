[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orion-agent-sdk"
version = "0.0.0"
description = "Reserved Python SDK scaffold for the Orion agent runtime"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Orion contributors" }]
classifiers = [
  "Development Status :: 1 - Planning",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://github.com/orion-runtime/orion"

[tool.hatch.build.targets.wheel]
packages = ["src/orion_sdk"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pyright]
include = ["src", "tests"]
strict = ["src"]
