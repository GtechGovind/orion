[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "orion-agent-sdk"
version = "0.1.0"
description = "Python SDK for the Orion Rust agent runtime pilot"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Govind Yadav", email = "gtech.govind2000@gmail.com" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://github.com/GtechGovind/orion"

[tool.maturin]
manifest-path = "../../bindings/python/Cargo.toml"
module-name = "orion_sdk._native"
python-source = "src"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
strict = ["src"]
