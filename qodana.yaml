version: "1.0"

# Kotlin/JVM is the default Qodana project for IDE and local CLI discovery.
# The workflow runs the additional language-specific configurations below.
linter: qodana-jvm-community
profile:
  name: qodana.recommended
projectJDK: "17"
rootJavaProjects:
  - sdks/kotlin

failureConditions:
  severityThresholds:
    critical: 0
    high: 0

exclude:
  - name: All
    paths:
      - target
      - sdks/javascript/node_modules
      - sdks/kotlin/.gradle
      - sdks/kotlin/build
      - sdks/python/.venv
