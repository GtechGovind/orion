name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: Orion is currently a non-functional scaffold. Use design discussions for unimplemented behavior.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reproducible example.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Rust workspace
        - Python SDK
        - JavaScript/TypeScript SDK
        - Kotlin SDK
        - Native bindings
        - Documentation or workflows
    validations:
      required: true
