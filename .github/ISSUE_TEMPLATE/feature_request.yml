name: Design or feature proposal
description: Propose a capability or architectural change
title: "[Proposal]: "
labels: [proposal, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user or systems problem without prescribing a solution.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: What source, production, research, or prototype evidence shows this problem is material?
    validations:
      required: true
  - type: textarea
    id: approaches
    attributes:
      label: Candidate approaches
      description: List credible alternatives and trade-offs.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Falsification or validation
      description: How could the project determine whether this proposal is correct?
    validations:
      required: true
