name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy,rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  python:
    name: Python native wheel
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: python -m pip install maturin "pydantic>=2.11,<3" ruff pyright
      - run: python -m compileall sdks/python/src examples/python/weather_agent
      - run: ruff check sdks/python/src sdks/python/tests examples/python/weather_agent
      - run: pyright -p sdks/python
      - run: maturin build --release --out dist
        working-directory: sdks/python
      - run: python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', *glob.glob('sdks/python/dist/*.whl')])"
      - run: python -m unittest discover -s sdks/python/tests -v

  javascript:
    name: JavaScript native package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: sdks/javascript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20.17.0"
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run check:package
      - run: npm run test:package
      - run: npm pack --dry-run

  kotlin:
    name: Kotlin SDK
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: ./gradlew test publishToMavenLocal --no-daemon
        working-directory: sdks/kotlin
        shell: bash

  repository:
    name: Repository policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify required project files
        run: |
          test -f AGENTS.md
          test -f rustfmt.toml
          test -f crates/AGENTS.md
          test -f bindings/AGENTS.md
          test -f sdks/python/AGENTS.md
          test -f sdks/javascript/AGENTS.md
          test -f sdks/kotlin/AGENTS.md
          test -f CLAUDE.md
          test -f GEMINI.md
          test -f README.md
          test -f .cursor/rules/orion-engineering.mdc
          test -f .github/copilot-instructions.md
          test -f .github/CONTRIBUTING.md
          test -f .github/SECURITY.md
          test -f .github/SUPPORT.md
          test -f .github/CODE_OF_CONDUCT.md
          test -f docs/policy/governance.md
          test -f docs/planning/roadmap.md
          test -f LICENSE-MIT
          test -f LICENSE-APACHE
          test -f docs/README.md
          test -f docs/development/repository-layout.md
          test -f docs/contracts/host-sdk.md
          test -f docs/decisions/0000-template.md
          test -f docs/decisions/0001-rust-semantic-kernel.md
          test -f docs/decisions/0002-cross-language-typed-schemas.md
          test -f examples/python/weather_agent/main.py
          test -f examples/javascript/weather-agent/src/main.ts
          test -f examples/kotlin/weather-agent/src/main/kotlin/dev/orion/example/weather/Main.kt
          test -f examples/javascript/weather-agent/package.json
      - name: Validate JSON documents
        run: |
          python -m json.tool schemas/protocol-v1.schema.json >/dev/null
          python -m json.tool conformance/scenarios/tool-loop.json >/dev/null
