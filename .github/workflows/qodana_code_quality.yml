name: Qodana code quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: qodana-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Rust
            id: rust
            config: .qodana/rust.yaml
            token: QODANA_RUST_TOKEN
          - name: Python
            id: python
            config: .qodana/python.yaml
            token: QODANA_PYTHON_TOKEN
          - name: JavaScript and TypeScript
            id: javascript
            config: .qodana/javascript.yaml
            token: QODANA_JAVASCRIPT_TOKEN
          - name: Kotlin and JVM
            id: kotlin
            config: qodana.yaml
            token: QODANA_KOTLIN_TOKEN

    steps:
      - name: Check out the analyzed revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Run ${{ matrix.name }} inspections
        uses: JetBrains/qodana-action@b588768b6e7e6da579e518bc584f79de0d243692 # v2026.2.0
        env:
          QODANA_TOKEN: ${{ secrets[matrix.token] }}
        with:
          args: --config,${{ matrix.config }}
          artifact-name: qodana-${{ matrix.id }}
          cache-default-branch-only: true
          post-pr-comment: true
          pr-mode: true
          push-fixes: none
          upload-result: true
          use-caches: true
          use-annotations: true
