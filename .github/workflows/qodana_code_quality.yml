name: Qodana code quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: qodana-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    env:
      QODANA_TOKEN: ${{ secrets[matrix.token] }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Rust
            id: rust
            config: .qodana/rust.yaml
            requires_token: true
            token: QODANA_RUST_TOKEN
          - name: Python
            id: python
            config: .qodana/python.yaml
            requires_token: false
            token: QODANA_PYTHON_TOKEN
          - name: JavaScript and TypeScript
            id: javascript
            config: .qodana/javascript.yaml
            requires_token: true
            token: QODANA_JAVASCRIPT_TOKEN
          - name: Kotlin and JVM
            id: kotlin
            config: qodana.yaml
            requires_token: false
            token: QODANA_KOTLIN_TOKEN

    steps:
      - name: Check out the analyzed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Report unavailable licensed linter
        if: matrix.requires_token && env.QODANA_TOKEN == ''
        run: echo "::warning::${{ matrix.name }} Qodana analysis requires ${{ matrix.token }}"

      - name: Run ${{ matrix.name }} inspections
        if: ${{ !matrix.requires_token || env.QODANA_TOKEN != '' }}
        uses: JetBrains/qodana-action@b588768b6e7e6da579e518bc584f79de0d243692 # v2026.2.0
        with:
          args: --config ${{ matrix.config }}
          artifact-name: qodana-${{ matrix.id }}
          cache-default-branch-only: true
          post-pr-comment: true
          pr-mode: false
          push-fixes: none
          upload-result: true
          use-caches: true
          use-annotations: true
