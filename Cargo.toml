[workspace]
resolver = "2"
members = [
  "crates/orion-protocol",
  "crates/orion-kernel",
  "crates/orion-checkpoint",
  "crates/orion-policy",
  "crates/orion-ffi",
  "crates/orion-testing",
  "bindings/python",
  "bindings/javascript",
  "bindings/kotlin",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/GtechGovind/orion"
homepage = "https://github.com/GtechGovind/orion"
authors = ["Govind Yadav <gtech.govind2000@gmail.com>"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.dependencies]
jsonschema = { version = "0.49", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
