version: "1.0"

linter: qodana-python-community
profile:
  name: qodana.recommended

# Give PyCharm's inspections an explicit interpreter with the same declared
# runtime dependency that strict Pyright and package consumers use. Qodana's
# cache directory persists this environment between runs.
bootstrap: |
  python3 -m venv /data/cache/orion-python
  /data/cache/orion-python/bin/python -m pip install --disable-pip-version-check "pydantic>=2.11,<3"

failureConditions:
  severityThresholds:
    critical: 0
    high: 0

exclude:
  - name: All
    paths:
      - target
      - sdks/javascript/node_modules
      - sdks/kotlin/.gradle
      - sdks/kotlin/build
      - sdks/python/.venv
