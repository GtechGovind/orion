version: "1.0"

linter: qodana-python-community
profile:
  name: qodana.recommended

# Give PyCharm's inspections the same declared runtime dependency that strict
# Pyright and package consumers use. Without it, unresolved Pydantic imports
# cascade into invalid type and dataclass diagnostics.
bootstrap: python3 -m pip install "pydantic>=2.11,<3"

failureConditions:
  severityThresholds:
    critical: 0
    high: 0

exclude:
  - name: All
    paths:
      - target
      - sdks/javascript/node_modules
      - sdks/kotlin/.gradle
      - sdks/kotlin/build
      - sdks/python/.venv
